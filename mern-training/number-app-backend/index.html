<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number App</title>
    <!-- 1. Load React and React DOM (UMD builds) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <!-- 2. Load Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="app"></div>

<!-- 3. Use type="text/babel" so Babel knows to process this script -->
<script type="text/jsx">
    // 4. Use the correct React 18 API: createRoot
    const container = document.getElementById('app');
    const root = ReactDOM.createRoot(container);
    root.render(<h1>Hello World</h1>);
</script>
</body>
</html>
